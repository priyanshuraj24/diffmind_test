services:
  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: diffmind-qdrant
    restart: unless-stopped
    volumes: [./data/qdrant:/qdrant/storage]
    networks: [internal, existing]
    mem_limit: 2g
    cpus: 2
    environment:
      QDRANT__TELEMETRY_DISABLED: 'true'
      QDRANT__SERVICE__API_KEY: ${DIFFMIND_QDRANT_API_KEY:?required}
networks:
  internal:
    internal: true
  existing:
    external: true
    name: ${EXISTING_DOCKER_NETWORK:-dokploy-network}
