[project]
name = "diffmind"
version = "0.1.0"
description = "Revision-aware GitHub reviews with mandatory hybrid code retrieval"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3", "psycopg[binary,pool]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3", "qdrant-client>=1.16,<1.17",
  "fastembed>=0.6,<1", "tree-sitter-language-pack==0.13.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "respx>=0.22,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diffmind"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_sample"]
markers = ["integration: needs PostgreSQL/Qdrant/model downloads"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
