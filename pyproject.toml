[project]
name = "diffmind-embeddings"
version = "0.2.0"
description = "Local embedding inference for an n8n-owned PR review workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "fastembed>=0.6,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embedding_service"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_sample"]
markers = ["integration: needs PostgreSQL/Qdrant/model downloads"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
